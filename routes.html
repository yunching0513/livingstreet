<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>荷蘭、德國生活街區考察路線</title>
  <meta name="description" content="115A-036 生活街區道路設計策略：烏特勒支、台夫特、阿姆斯特丹、柏林、德勒斯登考察路線互動地圖" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Varela+Round&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="assets/routes.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">🚶</span>
      <div>
        <h1>荷蘭、德國生活街區考察路線</h1>
        <p class="subtitle">烏特勒支、台夫特、阿姆斯特丹、柏林、德勒斯登 · 2026/11/16–24</p>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost" href="index.html"><span class="upload-label-text">照片案例地圖</span><span class="upload-label-short" aria-hidden="true">📷</span></a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head" id="sidebar-head">
        <div class="sheet-grip" id="sheet-grip" role="button" tabindex="0"
             aria-label="展開或收合清單"><span class="sheet-handle" aria-hidden="true"></span></div>
        <div class="sheet-peek" id="sheet-peek" aria-hidden="true"></div>
        <div class="country-tabs" id="country-tabs" role="tablist" aria-label="國家"></div>
        <div class="city-tabs" id="city-tabs" role="tablist" aria-label="日期與城市"></div>
        <div class="city-summary" id="city-summary"></div>
        <div class="near-me" id="near-me" hidden></div>
        <div class="type-filters" id="type-filters" role="group" aria-label="場域類型"></div>
        <div class="map-toggles">
          <label class="photo-toggle"><input type="checkbox" id="label-toggle" checked /> 地點名稱</label>
          <label class="photo-toggle"><input type="checkbox" id="photo-toggle" checked /> 附近實拍</label>
        </div>
      </div>
      <ol id="stop-list" class="stop-list"></ol>
      <div id="city-docs" class="city-docs"></div>
      <p class="list-foot">荷蘭段路線依OpenStreetMap步行路網計算。德國段停留點座標已逐點校對，少數（EUREF正門與園區餐廳、Stadtforum、IÖR Weberplatz）依鄰近參考點推估；其路線線條為概略連線，非步行路網計算結果。彈出視窗的 Google Maps 連結以地點名稱查詢，實際導航請以該連結為準。時間皆為估算值；標示「待確認」者請於行前向地方政府、學校或接待單位確認。</p>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <button class="locate-btn" id="locate-btn" type="button" aria-pressed="false"
              title="顯示我的位置"><span class="locate-icon" aria-hidden="true"></span><span class="sr-only">顯示我的位置</span></button>
      <div class="map-msg" id="map-msg" role="status" hidden></div>
      <div class="map-legend" id="map-legend">
        <span><i class="lg lg-walk"></i>步行</span>
        <span><i class="lg lg-bike"></i>自行車</span>
        <span><i class="lg lg-tram"></i>電車</span>
        <span><i class="lg lg-approx"></i>概略連線</span>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/locate.js"></script>
  <script src="assets/routes.js"></script>
</body>
</html>
