<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生活街道案例地圖</title>

  <!-- 圓潤字體：Huninn 粉圓 + Varela Round -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Varela+Round&display=swap" rel="stylesheet" />

  <!-- Leaflet 地圖 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">🌳</span>
      <div>
        <h1>生活街道案例地圖</h1>
        <p class="subtitle">依照片 GPS 座標，把街道案例標在地圖上</p>
      </div>
    </div>
    <div class="header-actions">
      <label class="btn upload-label" for="file-input"><span class="upload-label-text">＋ 加入照片</span><span class="upload-label-short" aria-hidden="true">＋</span></label>
      <input id="file-input" type="file" accept="image/*,.heic,.heif" multiple hidden />
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head" id="sidebar-head">
        <span class="sheet-handle" aria-hidden="true"></span>
        <div class="sidebar-summary">
          <span class="section-label">案例清單 · Cases</span>
          <span id="photo-count" class="count">0 個案例</span>
        </div>
        <div class="category-toolbar" aria-label="照片分類篩選">
          <div class="toolbar-row">
            <span class="toolbar-label">依分類瀏覽</span>
            <button class="btn btn-ghost toolbar-download" id="download-all" hidden>⬇ 下載全部</button>
          </div>
          <div id="category-filters" class="category-filters" role="group" aria-label="照片分類"></div>
        </div>
      </div>
      <ul id="photo-list" class="photo-list"></ul>
      <div id="empty-state" class="empty-state">
        <p>目前地圖上還沒有照片。</p>
        <p>把 iPhone 照片<strong>拖曳到這個視窗</strong>，或按右上角「＋ 加入照片」，
           就會依照片內的 GPS 座標顯示在地圖上。</p>
        <p class="hint">找不到座標？請確認拍照時 iPhone 有開啟「相機」的定位權限。</p>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div id="drop-overlay" class="drop-overlay">
        <div class="drop-inner">放開以加入照片</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 函式庫（需要網路連線載入）-->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script src="assets/app.js"></script>
</body>
</html>
