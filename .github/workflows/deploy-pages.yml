name: Deploy to GitHub Pages

# 備用的 Actions 部署方式（目前改用 Pages「從分支部署 / Deploy from a branch」）。
# 因此這個工作流程不再自動執行，只保留手動觸發，避免產生失敗訊息。

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只發佈網站需要的檔案（不含 photos/ 原始大檔）
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data thumbs _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # 自動啟用 GitHub Pages，免手動到 Settings 開啟

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
