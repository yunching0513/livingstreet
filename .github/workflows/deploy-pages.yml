name: Deploy to GitHub Pages

# 把地圖網站部署到 GitHub Pages。
# 首次使用請到 Settings → Pages，把 Source 設為「GitHub Actions」。
# 之後只要 main 有更新（含照片經 Build map 自動產生的資料），就會自動重新部署。

on:
  push:
    branches:
      - main
      - claude/photo-location-map-display-br3696
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只發佈網站需要的檔案（不含 photos/ 原始大檔）
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data thumbs _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # 自動啟用 GitHub Pages，免手動到 Settings 開啟

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
